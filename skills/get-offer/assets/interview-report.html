<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{document_title}}</title>
  <style>
    :root {
      --ink: #202328;
      --muted: #646B73;
      --line: #E3E5E8;
      --paper: #FFFFFF;
      --bg: #F4F5F2;
      --navy: #243F5A;
      --good: #1F7A4D;
      --good-bg: #E6F4EC;
      --improve: #9A5B00;
      --improve-bg: #FDF1DC;
      --redo: #B3261E;
      --redo-bg: #FBE7E5;
      --better-bg: #F2F6FA;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.7;
    }
    main { max-width: 1180px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { margin: 0; color: var(--navy); font-size: 26px; line-height: 1.3; }
    h2 { margin: 40px 0 16px; color: var(--navy); font-size: 20px; }
    h3 { margin: 0; font-size: 17px; line-height: 1.5; }
    h4 { margin: 0 0 8px; color: var(--muted); font-size: 13px; letter-spacing: .5px; }
    h5 { margin: 14px 0 6px; font-size: 14px; }
    p { margin: 0 0 8px; }
    ul, ol { margin: 0 0 8px; padding-left: 20px; }
    li { margin: 2px 0; }
    a { color: var(--navy); }
    .report-header { padding-bottom: 16px; border-bottom: 2px solid var(--navy); }
    .meta { margin-top: 10px; color: var(--muted); font-size: 13px; }
    .meta p { margin: 0 0 2px; }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
    .verdict { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
    .label-summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
    .overview-grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; margin-bottom: 8px; }
    .overview-grid > div { padding: 12px 14px; border-radius: 8px; }
    .overview-grid .strengths { background: var(--good-bg); }
    .overview-grid .issues { background: var(--redo-bg); }
    .overview-grid h4 { color: var(--ink); }
    .chip {
      display: inline-block; padding: 1px 10px; border-radius: 999px;
      font-size: 13px; font-weight: 600; white-space: nowrap;
    }
    .chip.good { color: var(--good); background: var(--good-bg); }
    .chip.improve { color: var(--improve); background: var(--improve-bg); }
    .chip.redo { color: var(--redo); background: var(--redo-bg); }
    .chip.small { padding: 0 7px; font-size: 12px; font-weight: 500; }
    .priority li { margin: 4px 0; }
    .qcard {
      background: var(--paper); border: 1px solid var(--line); border-left: 5px solid var(--line);
      border-radius: 10px; margin: 0 0 14px;
    }
    .qcard.good { border-left-color: var(--good); }
    .qcard.improve { border-left-color: var(--improve); }
    .qcard.redo { border-left-color: var(--redo); }
    .q-head {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;
      padding: 16px 20px; cursor: pointer; list-style: none;
    }
    .q-head::-webkit-details-marker { display: none; }
    .q-head::after { content: "展开"; margin-left: auto; color: var(--muted); font-size: 12px; }
    .qcard[open] > .q-head::after { content: "收起"; }
    .q-no { color: var(--navy); font-weight: 700; }
    .q-time { color: var(--muted); font-size: 13px; }
    .q-head h3 { flex: 1 1 320px; min-width: 0; }
    .q-inner { padding: 0 20px 18px; }
    .q-focus { margin: 0 0 14px; padding: 8px 12px; background: var(--bg); border-radius: 8px; font-size: 14px; }
    .q-focus strong { color: var(--navy); }
    .q-focus ul { margin: 2px 0 0; }
    .q-body { display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }
    .turn { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--line); }
    .turn.ask { border-left-color: var(--navy); background: var(--bg); padding: 6px 10px 2px 12px; border-radius: 0 6px 6px 0; }
    .turn .who { margin: 0 0 2px; color: var(--muted); font-size: 12px; font-weight: 600; }
    .turn p { color: #33373D; }
    mark { padding: 0 2px; border-radius: 3px; color: inherit; }
    mark.keep { background: var(--good-bg); box-shadow: inset 0 -2px 0 var(--good); }
    mark.fix { background: var(--redo-bg); box-shadow: inset 0 -2px 0 var(--redo); }
    mark sup, .n {
      display: inline-block; min-width: 16px; height: 16px; margin-left: 2px; padding: 0 3px;
      border-radius: 8px; background: var(--redo); color: #fff; font-size: 11px; line-height: 16px;
      text-align: center; vertical-align: 2px; font-weight: 700;
    }
    .q-advice .keep-list li::marker { color: var(--good); }
    .q-advice .fix-list, .q-advice .changes { list-style: none; padding-left: 0; }
    .q-advice .fix-list li, .q-advice .changes li { margin: 6px 0; }
    .better { margin-top: 12px; padding: 12px 14px; background: var(--better-bg); border-radius: 8px; }
    .better h5 { margin-top: 0; color: var(--navy); }
    .changes, .practice { font-size: 14px; }
    .practice { margin-top: 10px; color: #33373D; }
    table { width: 100%; border-collapse: collapse; background: var(--paper); font-size: 14px; }
    th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background: var(--bg); }
    table + p { margin-top: 10px; }
    .note { color: var(--muted); font-size: 13px; }
    @media (max-width: 860px) {
      .overview-grid, .q-body { grid-template-columns: 1fr; }
      main { padding: 20px 12px 48px; }
      .q-head, .q-inner { padding-left: 14px; padding-right: 14px; }
    }
    @media print {
      body { background: #fff; font-size: 12px; }
      main { max-width: none; padding: 0; }
      .qcard, .panel { break-inside: avoid; }
      .q-head::after { content: none; }
      mark, .chip, .better, .q-focus, .overview-grid > div { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <main>
    <header class="report-header">{{header}}</header>
    <!-- 示例：按此嵌套生成下方各占位，正式报告删除本注释。原话先转义再加标记。
    header（不写技能名或版本号）：
      <h1>公司 · 岗位 · 轮次 面试复盘</h1>（模拟写“模拟面试点评”）
      <div class="meta"><p>日期｜材料来源｜评价基准</p></div>
    overview：
      <section class="panel">
        <p class="verdict">按业务一面的标准，一句话结论。</p>
        <div class="label-summary"><span class="chip good">答得好 5</span><span class="chip improve">需补强 8</span><span class="chip redo">要重练 0</span></div>
        <div class="overview-grid">
          <div class="strengths"><h4>最突出的优点</h4><ul><li>具体做法（Q02）</li></ul></div>
          <div class="issues"><h4>最要害的问题</h4><ul><li>问题及对判断的影响（Q03）</li></ul></div>
        </div>
        <h4>先改这三题</h4>
        <ol class="priority"><li><a href="#q03">Q03 项目分工</a>：为什么先改</li></ol>
        <p class="note">答得好的题默认收起，点题目展开。</p>
      </section>
      模拟点评在 panel 之后加：
      <h2>覆盖情况</h2><table><tr><th>能力</th><th>类型</th><th>在哪题考到</th><th>表现</th></tr><tr><td>SQL</td><td>硬技能</td><td>未考到</td><td>未考到，未知</td></tr></table>
    questions，需补强或要重练（带 open，展开）：
      <details class="qcard improve" id="q03" open>
        <summary class="q-head"><span class="q-no">Q03</span><span class="q-time">05:59</span><h3>问题原文</h3><span class="chip improve">需补强</span></summary>
        <div class="q-inner">
          <div class="q-focus"><strong>面试官想考察：</strong><ul><li>考察点</li></ul></div>
          <div class="q-body">
            <section class="q-answer"><h4>你的回答</h4>
              <div class="turn"><p class="who">你</p><p>完整回答，<mark class="keep">值得保留的说法</mark>，<mark class="fix">有问题的说法<sup>1</sup></mark>。</p></div>
              <div class="turn ask"><p class="who">追问 06:20</p><p>追问原文</p></div>
              <div class="turn"><p class="who">你 <span class="chip small redo">要重练</span></p><p><mark class="fix">有问题的说法<sup>2</sup></mark>。</p></div>
            </section>
            <section class="q-advice"><h4>怎么改</h4>
              <h5>问题在哪</h5><ol class="fix-list"><li><span class="n">1</span> 缺什么、为什么影响判断</li><li><span class="n">2</span> …</li></ol>
              <h5>讲圆满</h5><p>只在有归属疑点时写。</p>
              <div class="better"><h5>改进后的答法</h5><p>对主问题的完整回答。</p><p><strong>追问原文</strong>对追问的回答，不写说话人。</p></div>
              <h5>改了什么</h5><ol class="changes"><li><span class="n">1</span> 「1 号标记的原话」→「改进答法里的新说法」：为什么</li></ol>
              <p class="practice"><strong>下次怎么练：</strong>一个练习动作或可能的追问</p>
            </section>
          </div>
        </div>
      </details>
    答得好（不带 open，收起；右栏没有“问题在哪”“改了什么”）：
      <details class="qcard good" id="q02"> … 结构同上，标签换成 chip good …
              <h5>好在哪</h5><ul class="keep-list"><li>具体做法</li></ul>
              <div class="better">…</div>
              <h5>还能更好的一处</h5><ul class="changes"><li>「左栏原话」→「更好的说法」：为什么</li></ul>
    反问环节：左栏候选人的提问用 turn 标“你”，面试官的回答用 turn ask 标“面试官回应”；改进后的答法只写更好的提问。
    closing：
      <h2>下一轮怎么准备</h2><section class="panel">…</section>
      <h2>可以写进简历的新素材</h2><table><tr><th>来源题号与原话</th><th>对应经历</th><th>候选改写</th><th>确认状态</th></tr>…</table>
      <h2>材料与说明</h2><section class="panel note">…</section>
    -->
    <h2>整体评价</h2>
    {{overview}}
    <h2>逐题对照</h2>
    {{questions}}
    {{closing}}
  </main>
  <script>
    function openTarget() {
      var id = decodeURIComponent(location.hash.slice(1));
      var el = id && document.getElementById(id);
      var card = el && el.closest("details");
      if (card) { card.open = true; el.scrollIntoView(); }
    }
    window.addEventListener("hashchange", openTarget);
    window.addEventListener("DOMContentLoaded", openTarget);
    window.addEventListener("beforeprint", function () {
      document.querySelectorAll("details").forEach(function (d) { d.open = true; });
    });
  </script>
</body>
</html>
