<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{document_title}}</title>
  <style>
    :root {
      --navy: #243F5A;
      --ink: #202328;
      --muted: #646B73;
    }
    @page { size: A4; margin: 20mm; }
    * { box-sizing: border-box; }
    html { font-size: 10.1pt; }
    body {
      margin: 0;
      color: var(--ink);
      background: #f2f2ef;
      font-family: "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", "Arial Unicode MS", "Microsoft YaHei", "Heiti SC", "PingFang SC", Arial, sans-serif;
      font-size: 10.1pt;
      line-height: 17.2pt;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .resume-sheet {
      width: 210mm;
      min-height: 297mm;
      margin: 12mm auto;
      padding: 20mm;
      background: white;
    }
    .resume-header {
      padding-bottom: 22pt;
      border-bottom: 1.1pt solid var(--navy);
    }
    .identity {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12pt 24pt;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      color: var(--navy);
      font-size: 28pt;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: .5pt;
      overflow-wrap: anywhere;
    }
    .target-role {
      margin: 0;
      color: var(--navy);
      font-size: 11.2pt;
      font-weight: 600;
    }
    .meta { margin-top: 14pt; }
    .meta p {
      margin: 0 0 7pt;
      color: var(--muted);
      font-size: 9.2pt;
      line-height: 15pt;
      overflow-wrap: anywhere;
    }
    .meta p:last-child { margin-bottom: 0; }
    .resume-section { margin-top: 26pt; }
    h2 {
      margin: 0 0 20pt;
      padding-left: 10pt;
      border-left: 2.3pt solid var(--navy);
      color: var(--navy);
      font-size: 11.2pt;
      line-height: 13pt;
      font-weight: 600;
      letter-spacing: .6pt;
      break-after: avoid;
      page-break-after: avoid;
    }
    .entry + .entry { margin-top: 22pt; }
    .entry-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 5pt 16pt;
      break-inside: avoid;
      break-after: avoid;
      page-break-after: avoid;
    }
    .entry-title {
      margin: 0;
      flex: 1 1 200pt;
      min-width: 0;
      font-size: 11.2pt;
      line-height: 17pt;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .entry-date {
      margin: 0 0 0 auto;
      color: var(--muted);
      font-size: 8.8pt;
      line-height: 14pt;
      text-align: right;
      white-space: nowrap;
    }
    .entry-role, .education-detail {
      margin: 7pt 0 0;
      color: var(--muted);
      font-size: 9.5pt;
      line-height: 16pt;
      break-after: avoid;
      page-break-after: avoid;
    }
    .scope { margin: 9pt 0 0; }
    .project { margin-top: 12pt; }
    .project-title {
      margin: 0 0 5pt;
      font-size: 10.1pt;
      line-height: 17.2pt;
      font-weight: 600;
      break-after: avoid;
      page-break-after: avoid;
    }
    .points { margin: 13pt 0 0; padding-left: 13pt; }
    .project .points { margin-top: 4pt; }
    .points li {
      margin: 0 0 7pt;
      padding-left: 1pt;
      overflow-wrap: anywhere;
      break-inside: avoid;
      page-break-inside: avoid;
      orphans: 2;
      widows: 2;
    }
    .points li:last-child { margin-bottom: 0; }
    .points li::marker { color: var(--navy); font-size: 8pt; }
    .theme { font-weight: 600; }
    .skills p { margin: 0 0 7pt; }
    .sample-notice {
      margin: 14pt 0 0;
      color: var(--muted);
      font-size: 7.1pt;
      line-height: 10pt;
      break-inside: avoid;
    }
    @media print {
      body { background: white; }
      .resume-sheet { width: auto; min-height: 0; margin: 0; padding: 0; }
    }
  </style>
</head>
<body>
  <main class="resume-sheet">
    <header class="resume-header">
      <div class="identity">
        <h1>{{name}}</h1>
        <p class="target-role">{{target_role}}</p>
      </div>
      <div class="meta">{{meta_lines}}</div>
    </header>
    <!-- 示例：按此嵌套生成下方的正文栏目占位，只选用实际需要的结构，正式稿删除本注释。
    <section class="resume-section">
      <h2>教育背景</h2>
      <div class="entry">
        <div class="entry-head"><p class="entry-title">学校｜专业｜学历</p><p class="entry-date">就读时间</p></div>
        <p class="education-detail">成绩或相关课程的补充信息，没有就删除。</p>
      </div>
    </section>
    <section class="resume-section">
      <h2>实习经历</h2>
      <div class="entry">
        <div class="entry-head"><p class="entry-title">公司或组织名称</p><p class="entry-date">任职时间</p></div>
        <p class="entry-role">实际岗位</p>
        <p class="scope">一句话交代真实工作边界，不需要就删除。</p>
        <div class="project"><p class="project-title">关键项目名称</p>
          <ul class="points"><li><span class="theme">报名流程</span>：个人动作与对应产物或结果。</li></ul>
        </div>
      </div>
    </section>
    <section class="resume-section">
      <h2>项目经历</h2>
      <div class="entry">
        <div class="entry-head"><p class="entry-title">项目名称｜实际角色</p><p class="entry-date">时间</p></div>
        <ul class="points"><li>个人解决的问题、做法及对应产物或结果。</li></ul>
      </div>
    </section>
    -->
    {{sections}}
    {{sample_notice}}
  </main>
</body>
</html>
