<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{document_title}}</title>
  <style>
    :root {
      --navy: #243F5A;
      --ink: #202328;
      --muted: #646B73;
      /* 标准间距。一页排不下时给 html 标签加 class="compact"，换成下面的紧凑间距；字号不变。 */
      --line: 15.6pt;
      --gap-section: 16pt;
      --gap-heading: 7pt;
      --gap-entry: 10pt;
      --gap-block: 4pt;
      --gap-item: 3pt;
    }
    html.compact {
      --line: 14.4pt;
      --gap-section: 10pt;
      --gap-heading: 6pt;
      --gap-entry: 7pt;
      --gap-block: 3pt;
      --gap-item: 1.5pt;
    }
    @page { size: A4; margin: 14mm 15mm; }
    * { box-sizing: border-box; }
    html { font-size: 10.1pt; }
    body {
      margin: 0;
      color: var(--ink);
      background: #f2f2ef;
      font-family: "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", "Arial Unicode MS", "Microsoft YaHei", "STHeiti", "Heiti SC", "PingFang SC", Arial, sans-serif;
      font-size: 10.1pt;
      line-height: var(--line);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .resume-sheet {
      width: 210mm;
      min-height: 297mm;
      margin: 12mm auto;
      padding: 14mm 15mm;
      background: white;
    }
    .resume-header {
      padding-bottom: 10pt;
      border-bottom: 2pt solid var(--navy);
    }
    .identity {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 4pt 24pt;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      color: var(--navy);
      font-size: 24pt;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: 1pt;
      overflow-wrap: anywhere;
    }
    .target-role {
      margin: 0;
      color: var(--navy);
      font-size: 11.5pt;
      font-weight: 600;
      letter-spacing: .4pt;
    }
    .meta { margin-top: var(--gap-block); }
    .meta p {
      margin: 0;
      color: var(--muted);
      font-size: 9.4pt;
      line-height: 15pt;
      overflow-wrap: anywhere;
    }
    .resume-section { margin-top: var(--gap-section); }
    h2 {
      margin: 0 0 var(--gap-heading);
      padding: 0 0 2.5pt;
      border-bottom: .6pt solid #D3D9E0;
      color: var(--navy);
      font-size: 10.6pt;
      line-height: 13pt;
      font-weight: 600;
      letter-spacing: 2pt;
      break-after: avoid;
      page-break-after: avoid;
    }
    .entry + .entry { margin-top: var(--gap-entry); }
    .entry-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0 16pt;
      break-inside: avoid;
      break-after: avoid;
      page-break-after: avoid;
    }
    .entry-title {
      margin: 0;
      flex: 1 1 200pt;
      min-width: 0;
      font-size: 11pt;
      line-height: 16pt;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .entry-date {
      margin: 0 0 0 auto;
      color: var(--muted);
      font-size: 9.2pt;
      line-height: 14pt;
      text-align: right;
      white-space: nowrap;
    }
    .entry-role, .education-detail {
      margin: 1pt 0 0;
      color: var(--muted);
      font-size: 9.5pt;
      line-height: 15pt;
      break-after: avoid;
      page-break-after: avoid;
    }
    .scope { margin: var(--gap-block) 0 0; }
    .project { margin-top: var(--gap-block); }
    .project-title {
      margin: 0;
      font-size: 10.1pt;
      line-height: var(--line);
      font-weight: 600;
      break-after: avoid;
      page-break-after: avoid;
    }
    .points { margin: var(--gap-block) 0 0; padding-left: 12pt; }
    .project .points { margin-top: var(--gap-item); }
    .points li {
      margin: 0 0 var(--gap-item);
      padding-left: 1pt;
      overflow-wrap: anywhere;
      break-inside: avoid;
      page-break-inside: avoid;
      orphans: 2;
      widows: 2;
    }
    .points li:last-child { margin-bottom: 0; }
    .points li::marker { content: "▪  "; color: var(--navy); font-size: 7pt; }
    .entry-role { color: #55708C; }
    .theme { font-weight: 600; }
    .pending, .draft-note {
      color: #A8431B;
      background: #FBEDE6;
      padding: 0 2pt;
      border-radius: 2pt;
    }
    .skills p { margin: 0 0 var(--gap-item); }
    .skills p:last-child { margin-bottom: 0; }
    .sample-notice {
      margin: var(--gap-heading) 0 0;
      color: var(--muted);
      font-size: 7.1pt;
      line-height: 10pt;
      break-inside: avoid;
    }
    @media print {
      body { background: white; }
      .resume-sheet { width: auto; min-height: 0; margin: 0; padding: 0; }
    }
  </style>
</head>
<body>
  <main class="resume-sheet">
    <header class="resume-header">
      <div class="identity">
        <h1>{{name}}</h1>
        <p class="target-role">{{target_role}}</p>
      </div>
      <div class="meta">{{meta_lines}}</div>
    </header>
    <!-- 示例：按此嵌套生成下方的正文栏目占位，只选用实际需要的结构，正式稿删除本注释。
    信息行每行一个 <p>联系方式或到岗时间</p>；只有待补稿在信息行里加 <p><span class="draft-note">待补草稿，空位补齐前勿投递</span></p>。
    演练稿的虚构提示不写在信息行，填进页面末尾的 sample_notice 占位：<p class="sample-notice">演练用虚构材料，请勿用于真实投递</p>；真实稿件删掉这个占位。
    <section class="resume-section">
      <h2>教育背景</h2>
      <div class="entry">
        <div class="entry-head"><p class="entry-title">学校｜专业｜学历</p><p class="entry-date">就读时间</p></div>
        <p class="education-detail">成绩或相关课程的补充信息，没有就删除。</p>
      </div>
    </section>
    <section class="resume-section">
      <h2>实习经历</h2>
      <div class="entry">
        <div class="entry-head"><p class="entry-title">公司或组织名称</p><p class="entry-date">任职时间</p></div>
        <p class="entry-role">实际岗位</p>
        <p class="scope">一句话交代真实工作边界，不需要就删除。</p>
        <div class="project"><p class="project-title">关键项目名称</p>
          <ul class="points"><li><span class="theme">报名流程</span>：个人动作与对应产物或结果。</li><li>缺的事实留成<span class="pending">[待确认：补什么]</span>，只在待补稿里出现。</li></ul>
        </div>
      </div>
    </section>
    <section class="resume-section">
      <h2>项目经历</h2>
      <div class="entry">
        <div class="entry-head"><p class="entry-title">项目名称｜实际角色</p><p class="entry-date">时间</p></div>
        <ul class="points"><li>个人解决的问题、做法及对应产物或结果。</li></ul>
      </div>
    </section>
    <section class="resume-section">
      <h2>技能证书</h2>
      <div class="skills"><p><span class="theme">数据</span>：工具或技能，带上使用场景和实际程度。</p></div>
    </section>
    -->
    {{sections}}
    {{sample_notice}}
  </main>
</body>
</html>
