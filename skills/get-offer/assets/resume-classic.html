<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="getoffer-style" content="经典单栏">
  <meta name="getoffer-layout" content="inline key-bold split-meta">
  <title>{{document_title}}</title>
  <style>
    :root {
      --ink: #191e21;
      --muted: #50575e;
      --rule: #9ba1a7;
      --line: 15.4pt;
      --gap-section: 15pt;
      --gap-heading: 6pt;
      --gap-entry: 10pt;
      --gap-block: 4pt;
      --gap-item: 3pt;
    }
    /* 一页排不下时给 html 标签加 class="compact"，换成紧凑间距；字号不变。 */
    html.compact {
      --line: 14.2pt;
      --gap-section: 10pt;
      --gap-heading: 5pt;
      --gap-entry: 7pt;
      --gap-block: 3pt;
      --gap-item: 1.5pt;
    }
    @page { size: A4; margin: 15mm 16mm; }
    * { box-sizing: border-box; }
    html { font-size: 10.3pt; }
    body {
      margin: 0;
      color: var(--ink);
      background: #e9e9e7;
      font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", "Arial Unicode MS", "STHeiti", "Heiti SC", Arial, sans-serif;
      font-size: 10.3pt;
      line-height: var(--line);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    h1, h2, p, ul { margin: 0; }
    h1 { font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
    .target-role { font-weight: 700; overflow-wrap: anywhere; }
    .meta p { color: var(--muted); font-size: 9.6pt; line-height: 14.5pt; overflow-wrap: anywhere; }
    .meta .sep { margin: 0 .55em; color: var(--rule); }
    .meta .meta-item { white-space: nowrap; }
    .meta .meta-long { white-space: normal; overflow-wrap: break-word; }
    .resume-section { margin-top: var(--gap-section); }
    h2 { margin: 0 0 var(--gap-heading); font-size: 12.6pt; line-height: 16pt; break-after: avoid; page-break-after: avoid; }
    .entry + .entry { margin-top: var(--gap-entry); }
    .entry-head {
      display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 0 14pt;
      break-inside: avoid; break-after: avoid; page-break-after: avoid;
    }
    .entry-title { flex: 1 1 220pt; min-width: 0; font-size: 10.8pt; line-height: 16pt; overflow-wrap: anywhere; }
    .entry-title b { font-weight: 700; }
    .entry-sub { margin-left: 1em; font-weight: 400; }
    .entry-date { margin-left: auto; color: var(--muted); font-size: 9.6pt; line-height: 15pt; white-space: nowrap; }
    .entry-role, .education-detail { margin: 1pt 0 0; color: var(--muted); font-size: 9.6pt; line-height: 15pt; }
    .scope { margin: var(--gap-block) 0 0; }
    .project { margin-top: var(--gap-block); }
    .project-title { font-weight: 700; break-after: avoid; page-break-after: avoid; }
    .points { margin: var(--gap-block) 0 0; padding-left: 13pt; }
    .project .points { margin-top: var(--gap-item); }
    .points li { margin: 0 0 var(--gap-item); padding-left: 1pt; overflow-wrap: anywhere; break-inside: avoid; page-break-inside: avoid; }
    .points li:last-child { margin-bottom: 0; }
    .theme { font-weight: 700; }
    .skills p { margin: 0 0 var(--gap-item); overflow-wrap: anywhere; }
    .skills p:last-child { margin-bottom: 0; }
    .pending, .draft-note { color: #A8431B; background: #FBEDE6; padding: 0 2pt; border-radius: 2pt; }
    .sample-notice { margin: var(--gap-section) 0 0; color: var(--muted); font-size: 7.5pt; line-height: 10pt; break-inside: avoid; }
    .resume-sheet { width: 210mm; min-height: 297mm; margin: 10mm auto; padding: 15mm 16mm; background: white; }
    .resume-header { padding-bottom: 9pt; border-bottom: 1.3pt solid var(--ink); }
    .identity { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4pt 24pt; }
    h1 { font-size: 25pt; letter-spacing: 1pt; }
    .target-role { font-size: 13.5pt; }
    .meta { margin-top: 6pt; }
    h2 { font-size: 13pt; letter-spacing: .5pt; }
    .points li::marker { color: var(--ink); }
    strong.key { font-weight: 700; }
    @media print {
      body { background: white; }
      .resume-sheet { width: auto; min-height: 0; margin: 0; padding: 0; }
    }
  </style>
</head>
<body>
  <main class="resume-sheet">
    <header class="resume-header">
      <div class="identity">
        <h1>{{name}}</h1>
        <p class="target-role">{{target_role}}</p>
      </div>
      <div class="meta">{{meta_lines}}</div>
    </header>
    <!-- 结构说明：正文由脚本生成。条目 .entry，条目头 .entry-head 里是 .entry-title（公司或名称加粗，
    岗位、专业放在 .entry-sub）和 .entry-date；要点 .points，主题标签 .theme；技能 .skills；
    待补空位 .pending，页头稿件提示 .draft-note，演练提示 .sample-notice。正式稿删除本注释。 -->
    {{sections}}
    {{sample_notice}}
  </main>
</body>
</html>
